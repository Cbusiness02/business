name: Nintendo Switch 2 Marktplaats Monitor

on:
  # Hernoemd van monitor_switch2.yml naar monitor_switch2_v2.yml (13-10-2026):
  # zie monitor_v2.yml voor de volledige uitleg (verse workflow-ID-registratie
  # omdat GitHub's schedule-trigger was vastgelopen; disable/enable hielp niet).
  #
  # Verlaagd naar elk uur (13-10-2026, op verzoek): was elke 5 minuten.
  # Minuut-offset 41 i.p.v. :00, om dezelfde reden als voorheen (GitHub's
  # "some queued jobs may be dropped" bij hoge belasting rond het hele/
  # halve uur) en gespreid t.o.v. de andere monitors zodat ze niet
  # gelijktijdig een runner opeisen.
  # Geen eigen schedule meer: draait via monitor_loop.yml (13-10-2026).
  # Handmatig starten kan nog steeds.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: switch2-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_PRICE_EUR: "300"
          POSTCODE: ${{ secrets.POSTCODE }}
          DISTANCE_KM: "28"
        run: python scripts/monitor_switch2.py

      - name: Commit bijgewerkte state
        run: |
          git config user.name "switch2-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_switch2.json
          git diff --cached --quiet || git commit -m "Update seen listings (Switch 2)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push mislukt (poging $i), opnieuw proberen na rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
